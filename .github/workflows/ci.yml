name: CI

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: 'Changelog'
        required: false
        default: ''
        type: string
      security_patch:
        description: 'Security patch date (YYYY-MM-DD)'
        required: true
        type: string

  pull_request:

  push:
    branches:
      - 'a23'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        target: [a23]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem
          echo -n "${{ secrets.OTA_KEY_PK8 }}" | base64 --decode > security/unica_ota.pk8
          echo -n "${{ secrets.OTA_KEY_PEM }}" | base64 --decode > security/unica_ota.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate build config
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          {
            echo "DEBUG=$DEBUG"
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Build dependencies
        run: ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: ./scripts/extract_fw.sh

      - name: Build ROM
        run: ./scripts/make_rom.sh

      - name: Build flashable zip
        run: |
          TARGET_FILES_ZIP="$(find "$OUT_DIR" -maxdepth 1 -name "${{ matrix.target }}_*-target_files.zip" | head -n 1)"
          if [ -z "$TARGET_FILES_ZIP" ] || [ ! -f "$TARGET_FILES_ZIP" ]; then
            echo "Error: target-files zip not found in $OUT_DIR" >&2
            exit 1
          fi
          ./scripts/build_flashable_zip.sh "$TARGET_FILES_ZIP"

      - name: Upload flashable zip to Pixeldrain
        if: github.event_name != 'pull_request'
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          chmod +x ./scripts/upload_pixeldrain.sh
          FLASHABLE_ZIP="$(find "$OUT_DIR" -maxdepth 1 -name "UN1CA_*.zip" | head -n 1)"
          if [ -z "$FLASHABLE_ZIP" ] || [ ! -f "$FLASHABLE_ZIP" ]; then
            echo "Error: Flashable zip not found in $OUT_DIR" >&2
            exit 1
          fi
          echo "Uploading $(basename "$FLASHABLE_ZIP") to Pixeldrain..."
          LINK="$(./scripts/upload_pixeldrain.sh "$FLASHABLE_ZIP" | head -n 1)"
          if [ -z "$LINK" ] || [ "$LINK" = "null" ]; then
            echo "Error: Failed to obtain Pixeldrain download link!" >&2
            exit 1
          fi
          echo "============================================="
          echo "Pixeldrain Download Link: $LINK"
          echo "============================================="
          SHA256="$(sha256sum "$FLASHABLE_ZIP" | cut -d ' ' -f 1)"
          MD5="$(md5sum "$FLASHABLE_ZIP" | cut -d ' ' -f 1)"
          {
            echo "PIXELDRAIN_LINK=$LINK"
            echo "ZIP_SHA256=$SHA256"
            echo "ZIP_MD5=$MD5"
            echo "ZIP_NAME=$(basename "$FLASHABLE_ZIP")"
          } >> "$GITHUB_ENV"
          {
            echo "### UN1CA for ${{ matrix.target }}"
            echo "- **Download**: [$LINK]($LINK)"
            echo "- **File**: \`$(basename "$FLASHABLE_ZIP")\`"
            echo "- **MD5**: \`$MD5\`"
            echo "- **SHA256**: \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update manifest in static_resources
        if: github.event_name != 'pull_request'
        env:
          GH_PAT: ${{ secrets.STATIC_RESOURCES_TOKEN }}
          CHANGELOG_INPUT: ${{ inputs.changelog }}
          SECURITY_PATCH_INPUT: ${{ inputs.security_patch }}
        run: |
          set -euo pipefail
          ZIP="$(find "$OUT_DIR" -maxdepth 1 -name "UN1CA_*.zip" | head -n 1)"
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "Error: Flashable zip not found in $OUT_DIR" >&2
            exit 1
          fi
          git clone "https://x-access-token:${GH_PAT}@github.com/qwertswa/static_resources.git" sr
          cd sr
          git fetch origin a23 2>/dev/null && git checkout -B a23 origin/a23 || git checkout -B a23
          mkdir -p updates
          python3 - "$ZIP" <<'PY'
          import json, os, sys, time
          zp = sys.argv[1]
          e = os.environ
          p = "updates/manifest.json"
          data = json.load(open(p)) if os.path.exists(p) else {"response": []}
          entry = {
              "datetime": int(e["ROM_BUILD_TIMESTAMP"]),
              "device": e["TARGET_CODENAME"],
              "filename": e["ZIP_NAME"],
              "id": e["ZIP_SHA256"],
              "patch": e["SECURITY_PATCH_INPUT"],
              "size": os.path.getsize(zp),
              "urls": [
                  "https://pixeldrain.com/api/file/"
                  + e["PIXELDRAIN_LINK"].rsplit("/", 1)[-1]
                  + "?download"
              ],
              "version": e["ROM_VERSION"],
              "incremental": 0,
          }
          if not any(x["id"] == entry["id"] for x in data["response"]):
              data["response"].append(entry)
          json.dump(data, open(p, "w"), indent=2)
          PY
          if [ -n "$CHANGELOG_INPUT" ]; then
            {
              echo "UN1CA ${ROM_VERSION} For ${TARGET_CODENAME}"
              echo
              printf '%s\n' "$CHANGELOG_INPUT" | sed 's/ \/ /\n/g'
            } > "updates/${ROM_VERSION}.txt"
          else
            if [ ! -f "updates/${ROM_VERSION}.txt" ]; then
              echo "UN1CA ${ROM_VERSION} For ${TARGET_CODENAME}" \
                > "updates/${ROM_VERSION}.txt"
            fi
          fi

          echo "============================================="
          echo "Changelog:"
          echo "============================================="
          cat "updates/${ROM_VERSION}.txt"
          echo "============================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates
          git commit -m "Add ${ROM_VERSION} (${TARGET_CODENAME})" || exit 0
          git pull --rebase origin a23 || true
          git remote set-url origin "https://x-access-token:${{ secrets.STATIC_RESOURCES_TOKEN }}@github.com/qwertswa/static_resources.git"
          git push origin a23

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          repository: qwertswa/static_resources
          token: ${{ secrets.STATIC_RESOURCES_TOKEN }}
          target_commitish: a23
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || env.ROM_VERSION }}
          name: UN1CA ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || env.ROM_VERSION }}
          body: |
            ## Download
            ### ${{ matrix.target }}
            - [Pixeldrain](${{ env.PIXELDRAIN_LINK }})